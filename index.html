<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeJS - Part 2</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🍳 RecipeJS</h1>
  <p>Your Functional Cooking Companion</p>
</header>

<main>

  <!-- CONTROLS -->
  <section class="controls">

    <!-- FILTER -->
    <div class="filter-group">
      <h3>Filter by Difficulty</h3>
      <div class="button-group">
        <button class="filter-btn active" data-filter="all">Show All</button>
        <button class="filter-btn" data-filter="easy">Easy</button>
        <button class="filter-btn" data-filter="medium">Medium</button>
        <button class="filter-btn" data-filter="hard">Hard</button>
        <button class="filter-btn" data-filter="quick">Quick (&lt;30min)</button>
      </div>
    </div>

    <!-- SORT -->
    <div class="sort-group">
      <h3>Sort By</h3>
      <div class="button-group">
        <button class="sort-btn" data-sort="name">Name A-Z</button>
        <button class="sort-btn" data-sort="time">Fastest</button>
        <button class="sort-btn" data-sort="none">Default</button>
      </div>
    </div>

  </section>

  <!-- RECIPES -->
  <div id="recipe-container"></div>

</main>

<script src="app.js"></script>
</body>
</html>
