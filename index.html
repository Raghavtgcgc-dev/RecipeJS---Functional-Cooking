<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeJS - Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================
       HEADER
  ========================== -->
  <header>
    <h1>🍳 RecipeJS</h1>
    <p>Your Functional Cooking Companion</p>

    <!-- Search -->
    <div class="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="Search recipes or ingredients..."
      >
      <button id="clear-search" class="clear-btn">✕</button>
    </div>
  </header>

  <!-- ==========================
       CONTROLS
  ========================== -->
  <main>

    <div class="controls">

      <!-- FILTER BUTTONS -->
      <div class="button-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="favorites">❤️ Favorites</button>
      </div>

      <!-- SORT BUTTONS -->
      <div class="button-group">
        <button class="sort-btn" data-sort="none">Default</button>
      </div>

    </div>

    <!-- RECIPE COUNTER -->
    <div class="recipe-info">
      <p id="recipe-count">Showing 0 recipes</p>
    </div>

    <!-- RECIPE CONTAINER -->
    <div id="recipe-container"></div>

  </main>

  <script src="app.js"></script>
</body>
</html>
